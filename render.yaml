services:
  - type: web
    name: course-compass
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: PYTHONUNBUFFERED
        value: "1"
